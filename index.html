<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Video App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg mt-4">
        <h1 class="text-xl font-bold mb-4 text-center text-blue-600">Tạo Video Tự Động</h1>
        
        <!-- Phần cài đặt -->
        <div id="config-section" class="mb-4 hidden">
            <p class="text-sm text-gray-500 mb-2">Nhập 1 lần duy nhất. App tự lưu trên điện thoại.</p>
            <input type="text" id="gh_token" placeholder="GitHub Token (ghp_...)" class="w-full border p-2 rounded mb-2 text-sm">
            <input type="text" id="gh_username" placeholder="Tên tài khoản GitHub của bạn" class="w-full border p-2 rounded mb-2 text-sm">
            <input type="text" id="b2_bucket" placeholder="Tên Bucket B2 (VD: auto-video-dat123)" class="w-full border p-2 rounded mb-2 text-sm">
            <input type="text" id="b2_key_id" placeholder="B2 Key ID (005...)" class="w-full border p-2 rounded mb-2 text-sm">
            <input type="text" id="b2_app_key" placeholder="B2 App Key (K005...)" class="w-full border p-2 rounded mb-2 text-sm">
            <input type="text" id="b2_endpoint" placeholder="B2 Endpoint (s3.us-west-004...)" class="w-full border p-2 rounded mb-2 text-sm">
            <button onclick="saveConfig()" class="w-full bg-gray-800 text-white p-2 rounded font-bold">LƯU CÀI ĐẶT</button>
        </div>

        <!-- Phần Upload -->
        <div id="upload-section" class="hidden">
            <div class="mb-4 bg-blue-50 p-3 rounded">
                <label class="block font-semibold mb-1 text-sm text-blue-800">1. File Âm Thanh (Chọn nhiều voice):</label>
                <input type="file" id="audio_files" accept="audio/*" multiple class="w-full text-sm">
            </div>
            <div class="mb-4 bg-green-50 p-3 rounded">
                <label class="block font-semibold mb-1 text-sm text-green-800">2. Chọn Ảnh (Chọn nhiều ảnh):</label>
                <input type="file" id="image_files" accept="image/*" multiple class="w-full text-sm">
            </div>
            
            <button onclick="startRender()" id="btn-render" class="w-full bg-blue-600 text-white p-3 rounded font-bold mb-2 text-lg shadow-md active:bg-blue-700">TẠO VIDEO</button>
            <button onclick="resetConfig()" class="w-full text-red-500 p-2 rounded text-xs mt-2">Xóa cài đặt (Làm lại từ đầu)</button>
            <p id="status" class="mt-4 text-center text-sm font-semibold text-gray-600"></p>
        </div>
    </div>

    <script>
        window.onload = () => {
            if(localStorage.getItem('b2_endpoint')) {
                document.getElementById('config-section').classList.add('hidden');
                document.getElementById('upload-section').classList.remove('hidden');
            } else {
                document.getElementById('config-section').classList.remove('hidden');
                document.getElementById('upload-section').classList.add('hidden');
            }
        }

        function saveConfig() {
            localStorage.setItem('gh_token', document.getElementById('gh_token').value.trim());
            localStorage.setItem('gh_username', document.getElementById('gh_username').value.trim());
            localStorage.setItem('b2_bucket', document.getElementById('b2_bucket').value.trim());
            localStorage.setItem('b2_key_id', document.getElementById('b2_key_id').value.trim());
            localStorage.setItem('b2_app_key', document.getElementById('b2_app_key').value.trim());
            localStorage.setItem('b2_endpoint', document.getElementById('b2_endpoint').value.trim());
            location.reload();
        }

        function resetConfig() {
            if(confirm("Bạn có chắc muốn xóa cài đặt?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Hàm mã hóa bằng chip điện thoại (Không cần thư viện ngoài)
        async function hmac(key, string) {
            const encoder = new TextEncoder();
            const keyData = typeof key === 'string' ? encoder.encode(key) : new Uint8Array(key);
            const cryptoKey = await crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
            return await crypto.subtle.sign('HMAC', cryptoKey, encoder.encode(string));
        }

        async function getSignatureKey(key, dateStamp, regionName, serviceName) {
            const kDate = await hmac('AWS4' + key, dateStamp);
            const kRegion = await hmac(kDate, regionName);
            const kService = await hmac(kRegion, serviceName);
            return await hmac(kService, 'aws4_request');
        }

        async function sha256(message) {
            const encoder = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', encoder.encode(message));
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function signedFetch(method, urlString, body = null, extraHeaders = {}) {
            const url = new URL(urlString);
            const endpoint = localStorage.getItem('b2_endpoint');
            const region = endpoint.split('.')[1]; 
            
            const now = new Date();
            const amzDate = now.toISOString().replace(/[:-]|\.\d{3}/g, '');
            const dateStamp = amzDate.slice(0, 8);
            
            let payloadHash = '';
            if (body) {
                if (body instanceof File || body instanceof Blob) {
                    payloadHash = await sha256(await body.arrayBuffer());
                } else {
                    payloadHash = await sha256(body);
                }
            } else {
                payloadHash = await sha256('');
            }
            
            const canonicalHeadersObj = {
                'host': url.host,
                'x-amz-date': amzDate,
                'x-amz-content-sha256': payloadHash,
                ...extraHeaders
            };
            
            const sortedHeaderKeys = Object.keys(canonicalHeadersObj).map(k => k.toLowerCase()).sort();
            const canonicalHeaders = sortedHeaderKeys.map(k => `${k}:${String(canonicalHeadersObj[k]).trim()}\n`).join('');
            const signedHeaders = sortedHeaderKeys.join(';');
            
            const queryString = url.search ? url.search.substring(1) : '';
            let canonicalQueryString = '';
            if (queryString) {
                const params = Array.from(new URLSearchParams(queryString).entries()).sort((a, b) => a[0].localeCompare(b[0]));
                canonicalQueryString = params.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
            }
            
            const canonicalRequest = [method, url.pathname, canonicalQueryString, canonicalHeaders, signedHeaders, payloadHash].join('\n');
            const credentialScope = `${dateStamp}/${region}/s3/aws4_request`;
            const stringToSign = ['AWS4-HMAC-SHA256', amzDate, credentialScope, await sha256(canonicalRequest)].join('\n');
            
            const secretKey = localStorage.getItem('b2_app_key');
            const accessKey = localStorage.getItem('b2_key_id');
            const signingKey = await getSignatureKey(secretKey, dateStamp, region, 's3');
            const signatureBuffer = await hmac(signingKey, stringToSign);
            const signature = Array.from(new Uint8Array(signatureBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            
            const authorizationHeader = `AWS4-HMAC-SHA256 Credential=${accessKey}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`;
            
            const fetchHeaders = {
                'Authorization': authorizationHeader,
                'x-amz-date': amzDate,
                'x-amz-content-sha256': payloadHash
            };
            for(let k in extraHeaders) fetchHeaders[k] = extraHeaders[k];
            
            return await fetch(url.toString(), { method, headers: fetchHeaders, body });
        }

        async function clearInputFolder(bucket, endpoint) {
            document.getElementById('status').innerText = "Đang dọn dẹp file cũ...";
            const listUrl = `https://${bucket}.${endpoint}/?list-type=2&prefix=input/`;
            const listRes = await signedFetch('GET', listUrl);
            const xml = await listRes.text();
            const keys = [...xml.matchAll(/<Key>(.*?)<\/Key>/g)].map(m => m[1]);
            for(const key of keys) {
                const encodedKey = key.split('/').map(encodeURIComponent).join('/');
                await signedFetch('DELETE', `https://${bucket}.${endpoint}/${encodedKey}`);
            }
        }

        async function uploadToB2(file, filename, bucket, endpoint) {
            const url = `https://${bucket}.${endpoint}/input/${filename}`;
            const res = await signedFetch('PUT', url, file, { 'Content-Type': file.type || 'application/octet-stream' });
            if(!res.ok) throw new Error("Lỗi upload: " + await res.text());
        }

        async function startRender() {
            const btn = document.getElementById('btn-render');
            const status = document.getElementById('status');
            
            const audioFiles = document.getElementById('audio_files').files;
            const imageFiles = document.getElementById('image_files').files;

            if(audioFiles.length === 0 || imageFiles.length === 0) {
                alert("Vui lòng chọn đủ file âm thanh và ít nhất 1 ảnh!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "ĐANG XỬ LÝ...";
            btn.classList.replace('bg-blue-600', 'bg-gray-400');

            try {
                const bucket = localStorage.getItem('b2_bucket');
                const endpoint = localStorage.getItem('b2_endpoint');

                await clearInputFolder(bucket, endpoint);

                for(let i=0; i<audioFiles.length; i++) {
                    status.innerText = `Đang upload âm thanh ${i+1}/${audioFiles.length}...`;
                    const prefix = (i+1).toString().padStart(2, '0');
                    const cleanName = audioFiles[i].name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
                    await uploadToB2(audioFiles[i], `audio_${prefix}_${cleanName}`, bucket, endpoint);
                }

                for(let i=0; i<imageFiles.length; i++) {
                    status.innerText = `Đang upload ảnh ${i+1}/${imageFiles.length}...`;
                    const prefix = (i+1).toString().padStart(2, '0');
                    const cleanName = imageFiles[i].name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
                    await uploadToB2(imageFiles[i], `image_${prefix}_${cleanName}`, bucket, endpoint);
                }

                status.innerText = "Đang ra lệnh cho AI render...";
                const ghToken = localStorage.getItem('gh_token');
                const ghUser = localStorage.getItem('gh_username');
                
                const ghRes = await fetch(`https://api.github.com/repos/${ghUser}/auto-video-bot/actions/workflows/render.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${ghToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ ref: 'main' })
                });

                if(!ghRes.ok) throw new Error("Lỗi gửi lệnh GitHub. Kiểm tra lại Token.");

                status.innerHTML = "✅ <b>THÀNH CÔNG!</b><br>Bot đang render (khoảng 10-15 phút).<br>Video sẽ nằm trong B2 của bạn.";
                btn.innerText = "HOÀN TẤT";
                btn.classList.replace('bg-gray-400', 'bg-green-600');
                
            } catch (error) {
                console.error(error);
                status.innerText = "❌ Lỗi: " + error.message;
                btn.disabled = false;
                btn.innerText = "THỬ LẠI";
                btn.classList.replace('bg-gray-400', 'bg-blue-600');
            }
        }
    </script>
</body>
    </html>
